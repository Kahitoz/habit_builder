# LifeForge backend — Deployment + Service.
#
# The `image` field holds IMAGE_PLACEHOLDER; the pipeline replaces it with the
# commit-tagged registry image. Vault credentials and the stable JWT secret are
# provisioned by Jenkins — see deploy/README.md.
#
# CORS_ORIGINS_PLACEHOLDER is replaced by the pipeline with the JSON list of
# allowed frontend origins for the target namespace.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeforge-backend
  labels:
    app: lifeforge-backend
    app.kubernetes.io/part-of: lifeforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lifeforge-backend
  template:
    metadata:
      labels:
        app: lifeforge-backend
        app.kubernetes.io/part-of: lifeforge
    spec:
      nodeSelector:
        app: app
      containers:
        - name: lifeforge-backend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lifeforge-backend-auth
                  key: JWT_SECRET
            - name: CORS_ORIGINS
              value: 'CORS_ORIGINS_PLACEHOLDER'
            - name: AUTO_CREATE
              value: "true"
            - name: DEBUG
              value: "false"
          envFrom:
            - secretRef:
                name: lifeforge-vault
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lifeforge-backend
  labels:
    app: lifeforge-backend
    app.kubernetes.io/part-of: lifeforge
spec:
  type: ClusterIP
  selector:
    app: lifeforge-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
