[project]
name = "lifeforge-backend"
version = "0.1.0"
description = "LifeForge habit + life-goals API (FastAPI, SQLAlchemy 2, SQLite/PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "pydantic>=2.8",
  "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
